name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
      - "feature/*"
      - "hotfix/*"
      - "release/*"
      - "fixes/*"
  push:
    branches:
      - main
      - develop

jobs:
  pre-commit:
    name: Pre-commit Hooks CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.9"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run Pre-commit
        env:
          PRE_COMMIT_USE_UV: "1"
        run: |
          uv run pre-commit run --show-diff-on-failure --color=always --all-files

  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.9"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run Tests
        run: |
          uv run pytest tests
